name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy via SSH (Password)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --working-dir=src

      - name: Install sshpass and rsync
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync

      - name: Deploy to cPanel via rsync (SSH password)
        env:
          SSHPASS: ${{ secrets.CPANEL_PASSWORD }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT || '22' }}
          CPANEL_PATH: ${{ secrets.CPANEL_PATH || 'public_html/' }}
        run: |
          sshpass -e rsync -avz --delete \
            -e "ssh -p ${CPANEL_PORT} -o StrictHostKeyChecking=no" \
            --exclude='.git*' \
            --exclude='.github/' \
            --exclude='.idea/' \
            --exclude='.vscode/' \
            --exclude='src/.env' \
            --exclude='src/.env.*' \
            --exclude='src/storage/' \
            --exclude='src/bootstrap/cache/*.php' \
            --exclude='src/node_modules/' \
            --exclude='assets/images/' \
            --exclude='src.zip' \
            --exclude='README.md' \
            ./ "${CPANEL_USER}@${CPANEL_HOST}:${CPANEL_PATH}"

      - name: Clear Laravel caches on server
        env:
          SSHPASS: ${{ secrets.CPANEL_PASSWORD }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT || '22' }}
          CPANEL_PATH: ${{ secrets.CPANEL_PATH || 'public_html/' }}
        run: |
          sshpass -e ssh -p "${CPANEL_PORT}" -o StrictHostKeyChecking=no "${CPANEL_USER}@${CPANEL_HOST}" \
            "cd ${CPANEL_PATH}src && php artisan optimize:clear"
